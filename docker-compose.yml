x-backend: &backend
  build:
    context: ./backend
  image: pulse-backend:local
  restart: unless-stopped
  env_file:
    - .env
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pulse:pulse@postgres:5432/pulse}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse} -d ${POSTGRES_DB:-pulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # one-shot: schema migrations run once, before anything else starts —
  # not inside the api command, where scaling the api would race migrations
  migrate:
    <<: *backend
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head

  seed:
    <<: *backend
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m app.seed

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  scheduler:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m app.engine.scheduler
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9101/metrics"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    <<: *backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pulse:pulse@postgres:5432/pulse}
      WORKER_PROJECT_SLUG: ${WORKER_PROJECT_SLUG:-demo}
      WORKER_QUEUES: ${WORKER_QUEUES:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
    # restart policy is what "heals" a worker after a chaos kill (exit 137)
    restart: always
    depends_on:
      seed:
        condition: service_completed_successfully
    command: python -m app.worker.main
    stop_grace_period: 40s  # > WORKER_SHUTDOWN_GRACE_SEC so drains can finish
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:8080"

  # --- observability --------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - pulse_prometheus:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pulse-overview.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - pulse_grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  pulse_pgdata:
  pulse_prometheus:
  pulse_grafana:
