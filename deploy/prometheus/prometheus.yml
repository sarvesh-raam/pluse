global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pulse-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: pulse-scheduler
    static_configs:
      - targets: ["scheduler:9101"]

  # Docker's embedded DNS returns every replica for the service name, so
  # `docker compose up --scale worker=3` is picked up automatically.
  - job_name: pulse-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 10s
