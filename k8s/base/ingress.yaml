apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse
  annotations:
    # long-lived WebSocket connections for live dashboard updates
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: pulse.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: api, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: frontend, port: {name: http}}}
