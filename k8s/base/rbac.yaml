# The API's chaos endpoint deletes worker pods through the Kubernetes API.
# Scoped to this namespace only; nothing else in the app talks to the API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulse-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pulse-chaos
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pulse-chaos
subjects:
  - kind: ServiceAccount
    name: pulse-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pulse-chaos
---
# Workers/scheduler need no API access at all
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulse-runtime
automountServiceAccountToken: false
